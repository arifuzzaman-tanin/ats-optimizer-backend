server {
    listen 80;
    server_name api.atsoptimizer.com;

    # -------------------------------
    # CORS + Preflight Handling
    # -------------------------------
    set $cors_origin "";

    # Allow specific origins (local development and your domain)
    if ($http_origin ~* ^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?$|^https?://(www\.)?atsoptimizer\.com$) {
        set $cors_origin $http_origin;
    }

    location /extract_skills {
        # --- Handle OPTIONS (Preflight) requests ---
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }

        # --- Proxy to Flask API ---
        proxy_pass http://flask-api:5000;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Add CORS headers for actual requests ---
        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
        add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range' always;
    }

    # -------------------------------
    # Health check endpoint
    # -------------------------------
    location /health {
        proxy_pass http://flask-api:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
