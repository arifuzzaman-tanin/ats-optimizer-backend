name: Test and deploy to PythonAnywhere

on:
  push:
    branches:
      - main-optimized
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pythonanywhere-production
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install package (editable)
        run: python -m pip install -e ".[pdf]"

      - name: Run tests
        run: python -m unittest discover -s tests -v

  deploy:
    runs-on: ubuntu-latest
    needs: test
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Upload application files
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$PYTHONANYWHERE_API_TOKEN" ]]; then
            echo "::error::The PYTHONANYWHERE_API_TOKEN secret is not configured."
            exit 1
          fi

          api_base="https://www.pythonanywhere.com/api/v0/user/arifuzzamantanin"
          project_dir="/home/arifuzzamantanin/mysite"

          while IFS= read -r -d '' file; do
            case "$file" in
              tests/*) continue ;;
            esac

            echo "Uploading $file"
            curl --silent --show-error --fail-with-body \
              --request POST \
              --header "Authorization: Token $PYTHONANYWHERE_API_TOKEN" \
              --form "content=@$file" \
              "$api_base/files/path$project_dir/$file"
          done < <(git ls-files -z -- '*.py' '*.json' 'requirements.txt')

      - name: Reload web application
        env:
          PYTHONANYWHERE_API_TOKEN: ${{ secrets.PYTHONANYWHERE_API_TOKEN }}
        run: |
          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Authorization: Token $PYTHONANYWHERE_API_TOKEN" \
            "https://www.pythonanywhere.com/api/v0/user/arifuzzamantanin/webapps/arifuzzamantanin.pythonanywhere.com/reload/"

      - name: Verify deployment
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 6 --retry-delay 5 --retry-all-errors \
            "https://arifuzzamantanin.pythonanywhere.com/health"
